<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
<style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#111827;font-size:20px}.title{font-size:26px;font-weight:700}.small{font-size:17px}.line{stroke:#475569;stroke-width:2}</style>
<rect width="1200" height="600" fill="white"/><text x="30" y="40" class="title">3.5 ms窄窗 任务27重负载关键事件</text>

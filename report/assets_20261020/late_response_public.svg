<text x="30" y="175">UART A事件</text><text x="30" y="275">GPIO响应</text><text x="30" y="375">SPI字节完成</text><text x="30" y="450">R0超期判定</text>
<circle cx="180" cy="170" r="7" fill="#506f94"/><text x="200" y="151">0 ms</text>
<circle cx="1033.624" cy="270" r="7" fill="#506f94"/><text x="805" y="249">实际响应 4.26812 ms</text>
